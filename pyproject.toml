[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlaquantshift"
version = "0.1.0"
description = "Paired quantization-by-distribution-shift evaluation extending VLAQuantBench"
readme = "README.md"
authors = [
  { name = "ksyint" },
]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "numpy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# LLM-only PTQ transfer experiment (Experiment 3); install inside the OpenVLA env
ptq = ["bitsandbytes>=0.43", "datasets", "accelerate"]

[project.scripts]
vqb = "vlaquantbench.cli:main"
vqs = "vlaquantshift.cli:main"

[tool.setuptools.packages.find]
include = ["vlaquantbench*", "vlaquantshift*"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests"]
